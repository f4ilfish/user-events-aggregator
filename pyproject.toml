[project]
name = "user-events-aggregator"
version = "0.1.0"
description = "Async FastAPI demo aggregating user events across identifiers and merged accounts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "coverage>=7.16,<8",
    "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.coverage.run]
branch = true
source = ["app"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "reports/coverage"

[tool.coverage.json]
output = "reports/coverage.json"
